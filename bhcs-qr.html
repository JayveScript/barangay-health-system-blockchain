<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALYO — Barangay Health Center QR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:32px 16px;
  background:linear-gradient(160deg,#EFF6FF 0%,#E0F2FE 55%,#F0F9FF 100%);
}
.bg-grid{
  position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(14,165,233,0.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(14,165,233,0.05) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, #000 0%, transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, #000 0%, transparent 80%);
}
.card{
  position:relative;z-index:10;
  background:#ffffff;
  border:1px solid #BAE6FD;
  border-radius:36px;
  padding:40px 40px 32px;
  max-width:460px;width:100%;
  text-align:center;
  box-shadow:0 30px 70px rgba(2,132,199,0.16),0 4px 14px rgba(2,132,199,0.08);
}
.badge{
  display:inline-flex;align-items:center;gap:7px;
  background:#EFF6FF;
  border:1px solid #BAE6FD;
  color:#0284C7;font-size:11px;font-weight:800;
  letter-spacing:1.4px;text-transform:uppercase;
  padding:7px 16px;border-radius:100px;
  margin-bottom:22px;
}
/* Kalyo app logo */
.logo-wrap{position:relative;width:96px;height:96px;margin:0 auto 18px}
.logo-ring{
  position:absolute;inset:-7px;border-radius:50%;
  border:2px solid rgba(14,165,233,0.25);
  animation:spin 9s linear infinite;
}
.logo-ring.two{inset:-13px;border-style:dashed;border-color:rgba(56,189,248,0.22);animation-duration:14s;animation-direction:reverse}
.logo{
  position:relative;width:96px;height:96px;border-radius:50%;
  object-fit:cover;
  background:linear-gradient(135deg,#38BDF8,#2563EB);
  box-shadow:0 10px 28px rgba(14,165,233,0.40);
  border:3px solid #fff;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* KALYO letters */
.kalyo-letters{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:12px}
.kalyo-letters span{
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,#38BDF8,#2563EB);
  color:#fff;font-size:16px;font-weight:900;
  box-shadow:0 8px 18px rgba(14,165,233,0.30);
}
.tagline{font-size:13px;font-weight:800;color:#0284C7;letter-spacing:0.3px}
.tagline-en{margin-top:2px;font-size:11px;font-style:italic;color:#94A3B8}
.sub{
  font-size:12px;color:#64748B;font-weight:600;
  letter-spacing:0.3px;margin:14px 0 24px;
}
.qr-frame{
  position:relative;display:inline-block;
  padding:16px;
  background:#fff;
  border-radius:24px;
  box-shadow:0 0 0 1px #E0F2FE,0 16px 40px rgba(2,132,199,0.14);
  margin-bottom:22px;
}
.corner{position:absolute;width:20px;height:20px;border-color:#0EA5E9;border-style:solid;border-width:0}
.corner.tl{top:-2px;left:-2px;border-top-width:3px;border-left-width:3px;border-radius:8px 0 0 0}
.corner.tr{top:-2px;right:-2px;border-top-width:3px;border-right-width:3px;border-radius:0 8px 0 0}
.corner.bl{bottom:-2px;left:-2px;border-bottom-width:3px;border-left-width:3px;border-radius:0 0 0 8px}
.corner.br{bottom:-2px;right:-2px;border-bottom-width:3px;border-right-width:3px;border-radius:0 0 8px 0}
.scan-label{font-size:11px;color:#0EA5E9;letter-spacing:2px;text-transform:uppercase;font-weight:800;margin-bottom:16px}
.url-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:#F0F9FF;border:1px solid #BAE6FD;
  padding:11px 18px;border-radius:100px;
  font-size:12px;font-family:'Courier New',monospace;
  color:#0369A1;letter-spacing:0.2px;font-weight:700;
  margin-bottom:22px;
}
.divider{height:1px;background:#E2E8F0;margin:0 -4px 18px}
.footer{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  background:#F8FAFC;border:1px solid #E2E8F0;
  padding:5px 11px;border-radius:100px;
  font-size:10px;font-weight:700;color:#475569;letter-spacing:0.3px;
}
.chip svg{color:#0EA5E9}
@keyframes pulse-glow{
  0%,100%{box-shadow:0 0 0 1px #E0F2FE,0 16px 40px rgba(2,132,199,0.14)}
  50%{box-shadow:0 0 0 1px #7DD3FC,0 16px 48px rgba(2,132,199,0.26)}
}
.qr-frame{animation:pulse-glow 3s ease-in-out infinite}
</style>
</head>
