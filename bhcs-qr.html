<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barangay Health System — QR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:#020817;
  overflow:hidden;
}
.bg-glow{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 50% 0%, rgba(14,165,233,0.18) 0%, transparent 70%),
             radial-gradient(ellipse 40% 40% at 80% 80%, rgba(56,189,248,0.10) 0%, transparent 60%);
}
.grid{
  position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(14,165,233,0.04) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(14,165,233,0.04) 1px,transparent 1px);
  background-size:40px 40px;
}
.card{
  position:relative;z-index:10;
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(24px);
  border:1px solid rgba(14,165,233,0.25);
  border-radius:36px;
  padding:52px 44px 44px;
  max-width:440px;width:90%;
  text-align:center;
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:36px;
  background:linear-gradient(135deg,rgba(14,165,233,0.07) 0%,transparent 60%);
  pointer-events:none;
}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(14,165,233,0.12);
  border:1px solid rgba(14,165,233,0.3);
  color:#38bdf8;font-size:11px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;
  padding:6px 14px;border-radius:100px;
  margin-bottom:24px;
}
.icon-ring{
  width:80px;height:80px;
  background:linear-gradient(135deg,#0ea5e9,#0284c7);
  border-radius:24px;
  margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 32px rgba(14,165,233,0.4),0 0 64px rgba(14,165,233,0.15);
}
.system-name{
  font-size:26px;font-weight:800;
  background:linear-gradient(90deg,#7dd3fc,#38bdf8,#0ea5e9);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:2px;text-transform:uppercase;
  line-height:1.2;margin-bottom:6px;
}
.sub{
  font-size:12px;color:rgba(148,163,184,0.8);
  letter-spacing:0.5px;margin-bottom:32px;
}
.qr-frame{
  position:relative;display:inline-block;
  padding:16px;
  background:white;
  border-radius:24px;
  box-shadow:0 0 0 1px rgba(14,165,233,0.3),
             0 0 40px rgba(14,165,233,0.2),
             0 20px 60px rgba(0,0,0,0.4);
  margin-bottom:28px;
}
.corner{
  position:absolute;width:20px;height:20px;
  border-color:#0ea5e9;border-style:solid;border-width:0;
}
.corner.tl{top:-1px;left:-1px;border-top-width:3px;border-left-width:3px;border-radius:8px 0 0 0}
.corner.tr{top:-1px;right:-1px;border-top-width:3px;border-right-width:3px;border-radius:0 8px 0 0}
.corner.bl{bottom:-1px;left:-1px;border-bottom-width:3px;border-left-width:3px;border-radius:0 0 0 8px}
.corner.br{bottom:-1px;right:-1px;border-bottom-width:3px;border-right-width:3px;border-radius:0 0 8px 0}
.scan-label{
  font-size:11px;color:#38bdf8;letter-spacing:2px;
  text-transform:uppercase;font-weight:600;
  margin-bottom:16px;
}
.url-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(14,165,233,0.1);
  border:1px solid rgba(14,165,233,0.25);
  padding:10px 18px;border-radius:100px;
  font-size:12px;font-family:'Courier New',monospace;
  color:#7dd3fc;letter-spacing:0.3px;
  margin-bottom:24px;
}
.divider{height:1px;background:rgba(14,165,233,0.12);margin:0 -4px 20px}
.footer{
  display:flex;align-items:center;justify-content:center;gap:16px;
  flex-wrap:wrap;
}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;color:rgba(100,116,139,0.9);
  letter-spacing:0.5px;
}
@keyframes pulse-glow{
  0%,100%{box-shadow:0 0 0 1px rgba(14,165,233,0.3),0 0 40px rgba(14,165,233,0.2),0 20px 60px rgba(0,0,0,0.4)}
  50%{box-shadow:0 0 0 1px rgba(14,165,233,0.5),0 0 60px rgba(14,165,233,0.35),0 20px 60px rgba(0,0,0,0.4)}
}
.qr-frame{animation:pulse-glow 3s ease-in-out infinite}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="grid"></div>
<div class="card">
  <div class="badge">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    Official System Access
  </div>
  <div class="icon-ring">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
    </svg>
  </div>
  <div class="system-name">Barangay Health System</div>
  <div class="sub">Barangay Health Center Management System</div>
  <div class="qr-frame">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div id="qrcode"></div>
  </div>
  <div class="scan-label">▸ Scan to access system ◂</div>
  <div class="url-pill">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    barangay-health-system-blockchain.vercel.app
  </div>
  <div class="divider"></div>
  <div class="footer">
    <span class="chip">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      Next.js 14
    </span>
    <span class="chip">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
      Neon PostgreSQL
    </span>
    <span class="chip">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Blockchain Secured
    </span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
new QRCode(document.getElementById("qrcode"),{
  text:"https://barangay-health-system-blockchain.vercel.app",
  width:220,height:220,
  colorDark:"#0369a1",colorLight:"#ffffff",
  correctLevel:QRCode.CorrectLevel.H
});
</script>
</body>
</html>
